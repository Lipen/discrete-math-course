# Тюнинг textcheck для прозы книги «Дискретная математика».
# Книга — научно-популярная проза, а не STE-документация: часть ГОСТ-правил ослаблена.
# Философия: линтер отчитывается, решение — за автором/агентом (см. .dev/1_active/text-checker/README.md).

[rules]
# Длина предложения: в книге длинные предложения уместны, но очень длинные резать
R001 = "info"
# Пассивный залог, причастия, деепричастия — норма академической русской прозы
R002 = "allowed"
R003 = "allowed"
R004 = "allowed"
# Аббревиатура без расшифровки
R005 = "warning"
# Сложное предложение
R006 = "info"
# Номинализация
R007 = "hint"
# Канцелярит и штампы — реально чистить
R101 = "warning"
R102 = "warning"
R103 = "warning"
R104 = "warning"
R105 = "warning"
# Двойное отрицание
R106 = "warning"
# Калька с английского
R107 = "hint"
# Цепочки родительного
R108 = "info"
