<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="290" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Hamming(7,4): which parity bit covers which positions</text>

  <!-- bit circles, positions 1..7 -->
  <g>
    <circle cx="70" cy="80" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₁</text>

    <circle cx="160" cy="80" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₂</text>

    <circle cx="250" cy="80" r="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="250" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₁</text>

    <circle cx="340" cy="80" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="340" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₄</text>

    <circle cx="430" cy="80" r="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="430" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₂</text>

    <circle cx="520" cy="80" r="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="520" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₃</text>

    <circle cx="610" cy="80" r="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="610" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₄</text>
  </g>

  <!-- position numbers -->
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="70" y="118">1</text>
    <text x="160" y="118">2</text>
    <text x="250" y="118">3</text>
    <text x="340" y="118">4</text>
    <text x="430" y="118">5</text>
    <text x="520" y="118">6</text>
    <text x="610" y="118">7</text>
  </g>

  <!-- parity rows -->
  <g stroke="#2563eb">
    <text x="20" y="164" font-size="12" font-weight="600" fill="#2563eb">p₁ covers</text>
    <line x1="110" y1="160" x2="680" y2="160" stroke-width="1.4"/>
    <line x1="70" y1="104" x2="70" y2="160" stroke-width="1" stroke-dasharray="3 3"/><circle cx="70" cy="160" r="5" fill="#2563eb"/>
    <line x1="250" y1="104" x2="250" y2="160" stroke-width="1" stroke-dasharray="3 3"/><circle cx="250" cy="160" r="5" fill="#2563eb"/>
    <line x1="430" y1="104" x2="430" y2="160" stroke-width="1" stroke-dasharray="3 3"/><circle cx="430" cy="160" r="5" fill="#2563eb"/>
    <line x1="610" y1="104" x2="610" y2="160" stroke-width="1" stroke-dasharray="3 3"/><circle cx="610" cy="160" r="5" fill="#2563eb"/>
  </g>

  <g stroke="#16a34a">
    <text x="20" y="204" font-size="12" font-weight="600" fill="#16a34a">p₂ covers</text>
    <line x1="110" y1="200" x2="680" y2="200" stroke-width="1.4"/>
    <line x1="160" y1="104" x2="160" y2="200" stroke-width="1" stroke-dasharray="3 3"/><circle cx="160" cy="200" r="5" fill="#16a34a"/>
    <line x1="250" y1="104" x2="250" y2="200" stroke-width="1" stroke-dasharray="3 3"/><circle cx="250" cy="200" r="5" fill="#16a34a"/>
    <line x1="520" y1="104" x2="520" y2="200" stroke-width="1" stroke-dasharray="3 3"/><circle cx="520" cy="200" r="5" fill="#16a34a"/>
    <line x1="610" y1="104" x2="610" y2="200" stroke-width="1" stroke-dasharray="3 3"/><circle cx="610" cy="200" r="5" fill="#16a34a"/>
  </g>

  <g stroke="#9333ea">
    <text x="20" y="244" font-size="12" font-weight="600" fill="#9333ea">p₄ covers</text>
    <line x1="110" y1="240" x2="680" y2="240" stroke-width="1.4"/>
    <line x1="340" y1="104" x2="340" y2="240" stroke-width="1" stroke-dasharray="3 3"/><circle cx="340" cy="240" r="5" fill="#9333ea"/>
    <line x1="430" y1="104" x2="430" y2="240" stroke-width="1" stroke-dasharray="3 3"/><circle cx="430" cy="240" r="5" fill="#9333ea"/>
    <line x1="520" y1="104" x2="520" y2="240" stroke-width="1" stroke-dasharray="3 3"/><circle cx="520" cy="240" r="5" fill="#9333ea"/>
    <line x1="610" y1="104" x2="610" y2="240" stroke-width="1" stroke-dasharray="3 3"/><circle cx="610" cy="240" r="5" fill="#9333ea"/>
  </g>

  <g font-size="11" fill="#64748b">
    <circle cx="20" cy="276" r="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="34" y="280">parity bit</text>
    <circle cx="130" cy="276" r="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="144" y="280">data bit</text>
  </g>
</svg>
