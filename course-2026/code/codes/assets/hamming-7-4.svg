<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="290" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Hamming(7,4): each parity bit is the xor of the data bits it covers</text>

  <!-- position numbers, above the bit circles -->
  <g font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">
    <text x="70" y="52">1</text>
    <text x="160" y="52">2</text>
    <text x="250" y="52">3</text>
    <text x="340" y="52">4</text>
    <text x="430" y="52">5</text>
    <text x="520" y="52">6</text>
    <text x="610" y="52">7</text>
  </g>

  <!-- the 7-bit codeword: parity bits blue, data bits green -->
  <g>
    <circle cx="70" cy="88" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₁</text>

    <circle cx="160" cy="88" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₂</text>

    <circle cx="250" cy="88" r="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="250" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₁</text>

    <circle cx="340" cy="88" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="340" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₄</text>

    <circle cx="430" cy="88" r="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="430" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₂</text>

    <circle cx="520" cy="88" r="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="520" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₃</text>

    <circle cx="610" cy="88" r="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="610" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₄</text>
  </g>

  <!-- p1 = d1 xor d2 xor d4: covers positions 1, 3, 5, 7 -->
  <g stroke="#2563eb">
    <text x="20" y="164" font-size="12" font-weight="600" fill="#2563eb">p₁ = d₁ ⊕ d₂ ⊕ d₄</text>
    <line x1="150" y1="160" x2="680" y2="160" stroke-width="1.4"/>
    <line x1="246" y1="112" x2="246" y2="160" stroke-width="1" stroke-dasharray="3 3"/><circle cx="246" cy="160" r="5" fill="#2563eb"/>
    <line x1="426" y1="112" x2="426" y2="160" stroke-width="1" stroke-dasharray="3 3"/><circle cx="426" cy="160" r="5" fill="#2563eb"/>
    <line x1="606" y1="112" x2="606" y2="160" stroke-width="1" stroke-dasharray="3 3"/><circle cx="606" cy="160" r="5" fill="#2563eb"/>
  </g>

  <!-- p2 = d1 xor d3 xor d4: covers positions 2, 3, 6, 7 -->
  <g stroke="#16a34a">
    <text x="20" y="204" font-size="12" font-weight="600" fill="#16a34a">p₂ = d₁ ⊕ d₃ ⊕ d₄</text>
    <line x1="150" y1="200" x2="680" y2="200" stroke-width="1.4"/>
    <line x1="250" y1="112" x2="250" y2="200" stroke-width="1" stroke-dasharray="3 3"/><circle cx="250" cy="200" r="5" fill="#16a34a"/>
    <line x1="520" y1="112" x2="520" y2="200" stroke-width="1" stroke-dasharray="3 3"/><circle cx="520" cy="200" r="5" fill="#16a34a"/>
    <line x1="610" y1="112" x2="610" y2="200" stroke-width="1" stroke-dasharray="3 3"/><circle cx="610" cy="200" r="5" fill="#16a34a"/>
  </g>

  <!-- p4 = d2 xor d3 xor d4: covers positions 4, 5, 6, 7 -->
  <g stroke="#9333ea">
    <text x="20" y="244" font-size="12" font-weight="600" fill="#9333ea">p₄ = d₂ ⊕ d₃ ⊕ d₄</text>
    <line x1="150" y1="240" x2="680" y2="240" stroke-width="1.4"/>
    <line x1="434" y1="112" x2="434" y2="240" stroke-width="1" stroke-dasharray="3 3"/><circle cx="434" cy="240" r="5" fill="#9333ea"/>
    <line x1="524" y1="112" x2="524" y2="240" stroke-width="1" stroke-dasharray="3 3"/><circle cx="524" cy="240" r="5" fill="#9333ea"/>
    <line x1="614" y1="112" x2="614" y2="240" stroke-width="1" stroke-dasharray="3 3"/><circle cx="614" cy="240" r="5" fill="#9333ea"/>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#64748b">
    <circle cx="20" cy="276" r="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="34" y="280">parity bit (computed)</text>
    <circle cx="200" cy="276" r="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="214" y="280">data bit (given)</text>
    <line x1="380" y1="276" x2="412" y2="276" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/><circle cx="412" cy="276" r="3" fill="#64748b"/><text x="422" y="280">value enters the xor</text>
  </g>
</svg>
