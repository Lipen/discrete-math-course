<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Hamming(7,4): parity bits are xors of data bits</text>

  <!-- the 7-bit codeword with position numbers -->
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="70" y="56">1</text>
    <text x="160" y="56">2</text>
    <text x="250" y="56">3</text>
    <text x="340" y="56">4</text>
    <text x="430" y="56">5</text>
    <text x="520" y="56">6</text>
    <text x="610" y="56">7</text>
  </g>

  <g>
    <circle cx="70" cy="90" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₁</text>
    <circle cx="160" cy="90" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₂</text>
    <circle cx="250" cy="90" r="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="250" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₁</text>
    <circle cx="340" cy="90" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="340" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₄</text>
    <circle cx="430" cy="90" r="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="430" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₂</text>
    <circle cx="520" cy="90" r="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="520" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₃</text>
    <circle cx="610" cy="90" r="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="610" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₄</text>
  </g>

  <text x="350" y="140" text-anchor="middle" font-size="13" fill="#334155">parity bits are computed as the xor of the data bits:</text>

  <!-- p1 = d1 xor d2 xor d4 -->
  <g>
    <circle cx="210" cy="180" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₁</text>
    <text x="258" y="187" text-anchor="middle" font-size="20" fill="#475569">=</text>
    <circle cx="300" cy="180" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="300" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₁</text>
    <text x="348" y="186" text-anchor="middle" font-size="20" fill="#475569">⊕</text>
    <circle cx="396" cy="180" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="396" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₂</text>
    <text x="444" y="186" text-anchor="middle" font-size="20" fill="#475569">⊕</text>
    <circle cx="492" cy="180" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="492" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₄</text>
  </g>

  <!-- p2 = d1 xor d3 xor d4 -->
  <g>
    <circle cx="210" cy="230" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₂</text>
    <text x="258" y="237" text-anchor="middle" font-size="20" fill="#475569">=</text>
    <circle cx="300" cy="230" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="300" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₁</text>
    <text x="348" y="236" text-anchor="middle" font-size="20" fill="#475569">⊕</text>
    <circle cx="396" cy="230" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="396" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₃</text>
    <text x="444" y="236" text-anchor="middle" font-size="20" fill="#475569">⊕</text>
    <circle cx="492" cy="230" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="492" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₄</text>
  </g>

  <!-- p4 = d2 xor d3 xor d4 -->
  <g>
    <circle cx="210" cy="280" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">p₄</text>
    <text x="258" y="287" text-anchor="middle" font-size="20" fill="#475569">=</text>
    <circle cx="300" cy="280" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="300" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₂</text>
    <text x="348" y="286" text-anchor="middle" font-size="20" fill="#475569">⊕</text>
    <circle cx="396" cy="280" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="396" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₃</text>
    <text x="444" y="286" text-anchor="middle" font-size="20" fill="#475569">⊕</text>
    <circle cx="492" cy="280" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="492" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">d₄</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#64748b">
    <circle cx="20" cy="320" r="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="34" y="324">parity bit (computed)</text>
    <circle cx="200" cy="320" r="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="214" y="324">data bit (given)</text>
  </g>
</svg>
