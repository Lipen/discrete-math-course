<svg xmlns="http://www.w3.org/2000/svg" width="460" height="320" viewBox="0 0 460 320" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="460" height="320" fill="#ffffff"/>
  <text x="230" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Parse tree of a³b³ for S -&gt; a S b | ε</text>

  <!-- S0 (root) -->
  <circle cx="70" cy="160" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">S</text>
  <text x="38" y="152" text-anchor="end" font-size="11" fill="#64748b">a S b</text>

  <!-- level 1: a, S1, b -->
  <circle cx="150" cy="50" r="14" fill="#fefce8" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">a</text>
  <circle cx="150" cy="160" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">S</text>
  <text x="118" y="152" text-anchor="end" font-size="11" fill="#64748b">a S b</text>
  <circle cx="150" cy="270" r="14" fill="#fefce8" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">b</text>

  <!-- level 2: a, S2, b -->
  <circle cx="230" cy="100" r="14" fill="#fefce8" stroke="#d97706" stroke-width="2"/>
  <text x="230" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">a</text>
  <circle cx="230" cy="160" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">S</text>
  <text x="198" y="152" text-anchor="end" font-size="11" fill="#64748b">a S b</text>
  <circle cx="230" cy="220" r="14" fill="#fefce8" stroke="#d97706" stroke-width="2"/>
  <text x="230" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">b</text>

  <!-- level 3: a, S3, b -->
  <circle cx="310" cy="130" r="14" fill="#fefce8" stroke="#d97706" stroke-width="2"/>
  <text x="310" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">a</text>
  <circle cx="310" cy="160" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">S</text>
  <text x="278" y="152" text-anchor="end" font-size="11" fill="#64748b">ε</text>
  <circle cx="310" cy="190" r="14" fill="#fefce8" stroke="#d97706" stroke-width="2"/>
  <text x="310" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">b</text>

  <!-- epsilon leaf -->
  <circle cx="390" cy="160" r="14" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 2"/>
  <text x="390" y="165" text-anchor="middle" font-size="13" font-style="italic" fill="#64748b">ε</text>

  <!-- edges -->
  <g stroke="#0f172a" stroke-width="1.5">
    <line x1="84" y1="154" x2="138" y2="54"/>
    <line x1="86" y1="160" x2="134" y2="160"/>
    <line x1="84" y1="166" x2="138" y2="264"/>
    <line x1="164" y1="154" x2="218" y2="104"/>
    <line x1="166" y1="160" x2="214" y2="160"/>
    <line x1="164" y1="166" x2="218" y2="214"/>
    <line x1="244" y1="154" x2="298" y2="134"/>
    <line x1="246" y1="160" x2="294" y2="160"/>
    <line x1="244" y1="166" x2="298" y2="184"/>
    <line x1="326" y1="160" x2="376" y2="160"/>
  </g>

  <text x="230" y="308" text-anchor="middle" font-size="12" fill="#64748b">leaves left to right: a a a ε b b b = a³b³</text>
</svg>
