<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="480" height="280" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">DFA: even number of 1s over {0, 1}</text>

  <!-- start arrow -->
  <line x1="46" y1="150" x2="112" y2="150" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="70" y="138" font-size="12" fill="#64748b">start</text>

  <!-- q0: start and accepting (double circle) -->
  <circle cx="150" cy="150" r="32" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="150" cy="150" r="26" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <text x="150" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">q₀</text>
  <text x="150" y="192" text-anchor="middle" font-size="11" fill="#64748b">accept</text>

  <!-- 0 self-loop on q0 (above) -->
  <path d="M 126 126 C 100 66, 200 66, 174 126" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="150" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">0</text>

  <!-- 1 edge q0 -> q1 (straight, label above) -->
  <line x1="182" y1="150" x2="296" y2="150" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="240" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">1</text>

  <!-- q1 -->
  <circle cx="330" cy="150" r="32" fill="#fefce8" stroke="#d97706" stroke-width="2"/>
  <text x="330" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">q₁</text>
  <text x="330" y="192" text-anchor="middle" font-size="11" fill="#64748b">reject</text>

  <!-- 0 self-loop on q1 (below) -->
  <path d="M 306 174 C 330 226, 354 174" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">0</text>

  <!-- 1 edge q1 -> q0 (curved below, label below) -->
  <path d="M 300 168 C 240 214, 180 168" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="240" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">1</text>
</svg>
