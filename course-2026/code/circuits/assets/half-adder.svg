<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="440" height="200" fill="#ffffff"/>
  <text x="220" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Half adder: S = A XOR B,  Cout = A AND B</text>

  <!-- inputs -->
  <text x="14" y="72" font-size="14" font-weight="700" fill="#1e3a8a">A</text>
  <text x="14" y="152" font-size="14" font-weight="700" fill="#1e3a8a">B</text>

  <!-- source wires -->
  <path d="M 30 63 H 110" fill="none" stroke="#0f172a" stroke-width="1.4"/>
  <path d="M 30 143 H 140" fill="none" stroke="#0f172a" stroke-width="1.4"/>

  <!-- A fan-out to XOR (top) and AND (top) -->
  <path d="M 110 63 V 54 H 180" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 110 63 V 134 H 180" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="110" cy="63" r="3" fill="#0f172a"/>

  <!-- B fan-out to XOR (bottom) and AND (bottom) -->
  <path d="M 140 143 V 84 H 180" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 143 V 164 H 180" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="140" cy="143" r="3" fill="#0f172a"/>

  <!-- XOR gate -->
  <rect x="180" y="40" width="80" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">XOR</text>

  <!-- AND gate -->
  <rect x="180" y="120" width="80" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">AND</text>

  <!-- outputs -->
  <path d="M 260 63 H 400" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="410" y="68" font-size="14" font-weight="700" fill="#0f172a">S</text>
  <path d="M 260 143 H 400" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="410" y="148" font-size="14" font-weight="700" fill="#0f172a">Cout</text>

  <text x="220" y="194" text-anchor="middle" font-size="11" fill="#64748b">A connects to both gates (fan-out), so two inputs build two outputs.</text>
</svg>
