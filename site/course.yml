semesters:
  - name: Осенний семестр
    tab: Осень
    year: 2026
    topics:
      - week: 2
        title: Высказывания и связки
        note: "Формула собирается из высказываний связками «и», «или», «не», «если, то». Таблица истинности перечисляет её значения на всех наборах, а дерево разбора задаёт порядок применения связок."
        slides: s1-lec01-statements
        chapters: [m01]
      - week: 3
        title: Предикаты и доказательства
        note: "Предикат это высказывание с переменными, и квантор «для всех» или «существует» замыкает их в утверждение. Доказательство бывает прямым, от противного или по индукции, а контрпример опровергает неверное."
        slides: s1-lec02-predicates
        chapters: [m01, m03]
      - week: 4
        title: Множества
        note: "Множество задаётся элементами, и операции над ним повторяют логические связки: объединение как «или», пересечение как «и», дополнение как «не». Булеан собирает все подмножества, декартово произведение составляет пары."
        slides: s1-lec03-sets
        chapters: [m04]
      - week: 5
        title: Отношения и эквивалентность
        note: "Отношение это множество пар, и свойства (рефлексивность, симметричность, транзитивность) решают, чем оно окажется. Замыкание добавляет пары, а эквивалентность режет множество на классы, и они складываются в разбиение."
        slides: s1-lec04-relations
        chapters: [m05]
      - week: 6
        title: Отношение порядка
        note: "Частичный порядок сравнивает элементы, но оставляет несравнимые пары: так устроены зависимости задач и делимость чисел. Диаграмма Хассе рисует только покрытия, а супремум и инфимум доводят аналогию с числами до решёток."
        slides: s1-lec05-order
        chapters: [m08]
      - week: 7
        title: Функции
        note: "Функция ставит каждому входу один выход, и её виды отвечают на разные вопросы: склеиваются ли входы, покрыты ли выходы, есть ли обратная. Композиция собирает отображения в цепочки, а биекция сравнивает размеры."
        slides: s1-lec06-functions
        chapters: [m06]
      - week: 8
        title: Счётность и несчётность
        note: "Биекция сравнивает множества по размеру, и на бесконечности это даёт неожиданное: целых и рациональных столько же, сколько натуральных. Диагональ Кантора строит число, которого нет в списке, и доказывает, что действительных больше."
        slides: s1-lec07-cardinality
        chapters: [m07]
      - week: 9
        title: Трансфинитное
        note: "Счёт продолжается после всех натуральных чисел: так появляются ординалы с пределом и следующим элементом. Кардиналы измеряют размер, а иерархии алефов и бет упираются в вопрос, независимый от аксиом ZFC."
        slides: s1-lec08-transfinite
        chapters: [m29, m07]
      - week: 10
        title: Язык и истина
        note: "Формула это дерево из связок и переменных, а значение появляется только в интерпретации. Таблица истинности даёт ответ для всех наборов, и из неё вырастают эквивалентность, следование и невыполнимость."
        slides: s1-lec09-propositional
        chapters: [m01]
      - week: 11
        title: Натуральная дедукция
        note: "Вывод строится из правил: у каждой связки есть введение и устранение, а нотация Фитча записывает его деревом. Корректность утверждает, что выводимое истинно, полнота отвечает за обратное, что всё истинное выводится."
        slides: s1-lec10-deduction
        chapters: [m02]
      - week: 12
        title: Логика первого порядка
        note: "Формулы говорят о предметах, их свойствах и отношениях, а истинность проверяется в модели. Кванторы выносятся вперёд, сколемизация заменяет «существует» функциями, и формула годится для машинного поиска доказательства."
        slides: s1-lec11-fol
        chapters: [m03]
      - week: 13
        title: Булевы функции и SAT
        note: "Булева функция задаётся таблицей на всех наборах нулей и единиц, и по этой таблице строятся ДНФ и КНФ. Совершенные формы дают каноническую запись, а вопрос, есть ли набор с истинной формулой, это задача SAT."
        slides: s1-lec12-boolean-sat
        chapters: [m10, m14]
      - week: 14
        title: Минимизация и полином Жегалкина
        note: "Формулу можно упростить, и по карте Карно это делается глазами: соседние единицы склеиваются в одно слагаемое. Метод Квайна и МакКласки повторяет то же перебором, а полином Жегалкина записывает функцию через сложение по модулю два."
        slides: s1-lec13-zhegalkin
        chapters: [m10]
      - week: 15
        title: Схемы и верификация
        note: "Вентили соединяются в схему, которая вычисляет булеву функцию, и сумматор оказывается частным случаем такой схемы. Функциональная полнота определяет, из каких вентилей собирается всё остальное, и одного NAND для этого достаточно."
        slides: s1-lec14-circuits
        chapters: [m11]
      - week: 16
        title: Коды, исправляющие ошибки
        note: "Код добавляет к данным проверочные биты, чтобы ошибку можно было не только заметить, но и исправить. Расстояние Хэмминга задаёт, сколько бит нужно изменить, а линейный код находит ошибку по синдрому без перебора слов."
        slides: s1-lec15-codes
        chapters: [m13]
      - week: 17
        title: Сжатие и границы
        note: "Префиксный код читается без разделителей, потому что ни одно слово не продолжает другое. Неравенство Крафта задаёт допустимые длины, Хаффман строит оптимальный код, а энтропия задаёт нижнюю границу средней длины."
        slides: s1-lec16-compression
        chapters: [m13]
  - name: Весенний семестр
    tab: Весна
    year: 2027
    topics:
      - week: 1
        title: Графы
        note: "Граф это вершины и рёбра, и уже степени вершин дают первый результат: их сумма вдвое больше числа рёбер. Пути, циклы и связность описывают устройство графа независимо от того, как его нарисовали."
        slides: s2-lec01-graphs
        chapters: [m09]
      - week: 2
        title: Обходы и деревья
        note: "Обход в ширину идёт слоями и находит путь с наименьшим числом рёбер, а обход в глубину уходит вглубь и делит рёбра на древесные и обратные. Из обхода получаются остовное дерево, деревья поиска и топологическая сортировка зависимостей."
        slides: s2-lec02-traversal
        chapters: [m09]
      - week: 3
        title: Циклы и паросочетания
        note: "Эйлеров цикл проходит по каждому ребру ровно раз, гамильтонов по каждой вершине, и простой критерий есть только для первого. Паросочетание выбирает рёбра без общих концов, а алгоритм Дейкстры ищет кратчайшие пути по весам."
        slides: s2-lec03-matching
        chapters: [m09]
      - week: 4
        title: Планарность, раскраска, потоки
        note: "Планарный граф рисуется на плоскости без пересечений, и формула Эйлера связывает у него вершины, рёбра и грани. Отсюда следует, что часть графов так не уложить, а раскраска и потоки решают задачи о назначениях."
        slides: s2-lec04-planarity
        chapters: [m09]
      - week: 5
        title: Детерминированные автоматы
        note: "Автомат хранит текущее состояние и читает слово по буквам, а язык составляют слова, доводящие его до принимающего состояния. Память это номер состояния, поэтому язык проверяется конечной памятью."
        slides: s2-lec05-dfa
        chapters: [m23]
      - week: 6
        title: Недетерминированные автоматы
        note: "Недетерминированный автомат допускает несколько переходов по одной букве и переходы без чтения, и так язык описывать удобнее. Конструкция подмножеств переделывает его в детерминированный автомат, поэтому класс языков не меняется."
        slides: s2-lec06-nfa
        chapters: [m23]
      - week: 7
        title: Регулярные выражения
        note: "Регулярное выражение собирается из букв конкатенацией, выбором и повторением, и теорема Клини говорит, что так задаются ровно языки автоматов. Лемма о накачке доказывает, что для языка из двух равных блоков букв автомат не построить."
        slides: s2-lec07-regex
        chapters: [m23]
      - week: 8
        title: Минимизация автоматов
        note: "Два состояния эквивалентны, если никакое слово не отличает их поведение. Фактор по такому разбиению даёт минимальный автомат, а теорема Майхилла и Нерода объясняет, почему меньше нельзя."
        slides: s2-lec08-minimization
        chapters: [m23]
      - week: 9
        title: Машина Тьюринга
        note: "Машина Тьюринга это автомат с неограниченной лентой, головкой и таблицей переходов, и лента снимает ограничение на память. Программа записывается состояниями и переходами: инкремент, сдвиг, копирование."
        slides: s2-lec09-turing
        chapters: [m25]
      - week: 10
        title: Универсальная машина
        note: "Описание машины кодируется числом, и тогда строится универсальная машина, которая читает это число и повторяет работу. Тезис Чёрча и Тьюринга утверждает, что так вычисляется всё, что вообще поддаётся вычислению."
        slides: s2-lec10-universal
        chapters: [m25]
      - week: 11
        title: Проблема остановки
        note: "Нет программы, которая по коду и входу всегда отвечает, остановится ли другая программа. Диагональная конструкция строит программу, ведущую себя противоположно предсказанию, а сведения переносят этот результат на другие задачи."
        slides: s2-lec11-halting
        chapters: [m26]
      - week: 12
        title: Разрешимость и теорема Райса
        note: "Разрешимое множество распознаётся машиной, которая всегда останавливается, а перечислимое этим не обязано. Теорема Райса говорит, что содержательное свойство программ неразрешимо, поэтому полный статический анализ невозможен."
        slides: s2-lec12-decidability
        chapters: [m26]
      - week: 13
        title: Правила счёта
        note: "Правило суммы складывает варианты взаимоисключающих случаев, а произведение перемножает независимые выборы. Шары и ящики показывают, где их путают, а принцип Дирихле доказывает существование повтора без перебора."
        slides: s2-lec13-counting
        chapters: [m18]
      - week: 14
        title: Бином и включение-исключение
        note: "Перестановки учитывают порядок, сочетания нет, и биномиальные коэффициенты считают выборки без порядка. Тождества удобнее доказывать двойным подсчётом одного множества, а включение-исключение убирает повторы при объединении."
        slides: s2-lec14-binomial
        chapters: [m18]
      - week: 15
        title: Рекурренции и производящие функции
        note: "Рекуррентное соотношение задаёт член последовательности через предыдущие, как у Фибоначчи или ханойской башни. Производящая функция превращает соотношение в уравнение на многочлены, и решение читается по коэффициентам."
        slides: s2-lec15-genfun
        chapters: [m18, m21]
      - week: 16
        title: Бёрнсайд и Рамсей
        note: "Лемма Бёрнсайда считает объекты с точностью до симметрии: раскраски, переходящие друг в друга поворотом, считаются раз. Теория Рамсея утверждает, что большое множество обязано содержать упорядоченную часть."
        slides: s2-lec16-ramsey
        chapters: [m21, m18]
